<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtSlaw — Your Personal Gallery Companion</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <!-- SEO -->
    <meta name="description" content="Paste any museum or gallery exhibition link and chat with ArtSlaw, your knowledgeable gallery guide. Discover the story behind the art." />
    <!-- Open Graph -->
    <meta property="og:title" content="ArtSlaw — Your Personal Gallery Companion" />
    <meta property="og:description" content="Paste any museum or gallery exhibition link and chat with ArtSlaw, your knowledgeable gallery guide. Discover the story behind the art." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.artslaw.io" />
    <!-- og:image — place a 1200×630px image at client/public/og-image.png before launch -->
    <meta property="og:image" content="/og-image.png" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ArtSlaw — Your Personal Gallery Companion" />
    <meta name="twitter:description" content="Paste any museum or gallery exhibition link and chat with ArtSlaw, your knowledgeable gallery guide. Discover the story behind the art." />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
