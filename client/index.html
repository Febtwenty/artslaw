<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>ArtSlaw — AI-Powered Art Tour Guide for Museum & Gallery Exhibitions</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#4F46E5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <!-- SEO -->
    <meta name="description" content="Paste a link to any museum or gallery exhibition and ArtSlaw walks you through the artist, the works, and the ideas. Your AI-powered gallery companion." />
    <link rel="canonical" href="https://www.artslaw.io" />
    <!-- Open Graph -->
    <meta property="og:title" content="ArtSlaw — AI-Powered Art Tour Guide" />
    <meta property="og:description" content="Paste a link to any exhibition. ArtSlaw researches it and walks you through the artist, the works, and the ideas." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.artslaw.io" />
    <!-- og:image — place a 1200×630px image at client/public/og-image.png before launch, then uncomment:
    <meta property="og:image" content="https://www.artslaw.io/og-image.png" />
    -->
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ArtSlaw — AI-Powered Art Tour Guide" />
    <meta name="twitter:description" content="Paste a link to any exhibition. ArtSlaw researches it and walks you through the artist, the works, and the ideas." />
    <!-- twitter:image — uncomment once og-image.png is created:
    <meta name="twitter:image" content="https://www.artslaw.io/og-image.png" />
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "ArtSlaw",
      "url": "https://www.artslaw.io",
      "description": "Paste any museum or gallery exhibition link and chat with ArtSlaw, your knowledgeable gallery guide. Discover the story behind the art.",
      "applicationCategory": "EducationApplication",
      "offers": { "@type": "Offer", "price": "0" }
    }
    </script>
  </head>
  <body>
    <script>
      (function() {
        var saved = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
